<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Kyou Web Music — Web Player</title>
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="icon" href="assets/kyou-logo.svg">
  <link rel="stylesheet" href="music.css">
<style>.back-to-class{position:fixed;top:10px;left:10px;z-index:9999;background:#181818;color:#fff;padding:8px 12px;border-radius:18px;text-decoration:none;font:700 12px Arial}.back-to-class:hover{background:#282828}</style></head>
<body><a class="back-to-class" href="index.html">← Kembali ke Website Kelas</a>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">N</div><span>Kyou Web Music</span></div>
      <nav>
        <button class="nav-item active" data-view="home"><span>⌂</span>Home</button>
        <button class="nav-item" data-view="search"><span>⌕</span>Search</button>
        <button class="nav-item" data-view="library"><span>▣</span>Your Library</button>
      </nav>
      <div class="side-section">
        <div class="side-title">Your Playlists <button id="newPlaylistBtn">＋</button></div>
        <div id="playlistList"></div>
      </div>
      <div class="sidebar-bottom">
        <button class="nav-item" id="settingsBtn"><span>⚙</span>Settings</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div class="top-arrows">
          <button id="backBtn">‹</button><button id="forwardBtn">›</button>
        </div>
        <div class="search-wrap">
          <span>⌕</span>
          <input id="searchInput" autocomplete="off" placeholder="What do you want to play?">
          <button id="clearSearch" class="clear-search">×</button>
        </div>
        <button class="profile" id="profileBtn"><span>ND</span><b>Guest</b>⌄</button>
      </header>

      <section id="content" class="content"></section>

      <div class="player">
        <div class="now">
          <img id="nowArt" src="" alt="">
          <div class="now-text"><b id="nowTitle">Nothing playing</b><span id="nowArtist">Choose a song</span></div>
          <button id="likeNow" class="icon-btn">♡</button>
        </div>
        <div class="controls">
          <div class="control-buttons">
            <button id="shuffleBtn">⤨</button>
            <button id="prevBtn">◀</button>
            <button id="playBtn" class="play-main">▶</button>
            <button id="nextBtn">▶</button>
            <button id="repeatBtn">↻</button>
          </div>
          <div class="timeline">
            <span id="currentTime">0:00</span>
            <input id="progress" type="range" min="0" max="100" value="0">
            <span id="duration">0:00</span>
          </div>
        </div>
        <div class="volume">
          <span>🔊</span>
          <input id="volume" type="range" min="0" max="100" value="80">
          <button id="queueBtn">☷</button>
        </div>
      </div>
    </main>
  </div>

  <aside class="now-playing-panel" id="nowPlayingPanel">
    <div class="np-head"><b>Now Playing</b><button id="closeNowPlaying">×</button></div>
    <img id="npArt" src="" alt="">
    <div class="np-title" id="npTitle">Nothing playing</div>
    <div class="np-artist" id="npArtist">Choose a song</div>
    <button id="npLike" class="np-like">♡</button>
    <div class="np-actions">
      <button id="npPrev">◀</button><button id="npPlay" class="np-big">▶</button><button id="npNext">▶</button>
    </div>
    <div class="np-queue-title">Up next</div>
    <div id="npQueue"></div>
  </aside>

  <div class="mobile-nav">
    <button data-view="home">⌂<span>Home</span></button>
    <button data-view="search">⌕<span>Search</span></button>
    <button data-view="library">▣<span>Library</span></button>
    <button id="mobilePlayer">♫<span>Now Playing</span></button>
  </div>

  <div id="ytPlayer" class="yt-hidden"></div>

  <div id="toast" class="toast"></div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" data-close>×</button>
      <h2>Settings</h2>
      <p class="muted">YouTube Data API v3 diperlukan agar pencarian YouTube dilakukan langsung dari website.</p>
      <label>YouTube API Key</label>
      <input id="apiKeyInput" type="password" placeholder="AIza...">
      <button id="saveApiKey" class="green-btn">Save API Key</button>
      <hr>
      <h3>Playback</h3>
      <label class="check"><input id="autoplaySetting" type="checkbox" checked> Autoplay lagu berikutnya</label>
      <label class="check"><input id="saveHistorySetting" type="checkbox" checked> Simpan riwayat di perangkat</label>
      <button id="clearData" class="danger-btn">Clear local data</button>
    </div>
  </div>

  <div id="playlistModal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" data-close>×</button>
      <h2>New Playlist</h2>
      <input id="playlistName" maxlength="40" placeholder="Nama playlist">
      <button id="createPlaylist" class="green-btn">Create</button>
    </div>
  </div>

  <div id="queueModal" class="modal hidden">
    <div class="modal-card queue-card">
      <button class="modal-close" data-close>×</button>
      <h2>Queue</h2>
      <div id="queueList"></div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="music.js"></script>
</body>
</html>
